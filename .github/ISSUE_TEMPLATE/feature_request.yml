name: Proposal
description: Something the kernel should be able to do and cannot
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/ni-sh-a-char/RESENTMENT---kernel/blob/main/ROADMAP.md)
        first — it lists both what is planned and what this project has decided
        not to do, along with why.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that you cannot do today? Describe the
        situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: >
        Include the API if it needs one. A patch to `include/rk/` is a fine way
        to say it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you considered instead
      description: >
        Including "do nothing". The smallest change that solves the problem
        usually wins here.

  - type: dropdown
    id: layer
    attributes:
      label: Which layer
      multiple: true
      options:
        - Boot and architecture support
        - Memory management
        - Scheduling
        - Capabilities and security
        - The runtime graph
        - Kaalka and crypto
        - The AI subsystem
        - SHE and the shell
        - Filesystems and IPC
        - Drivers
        - Build, tooling and tests
        - Documentation
