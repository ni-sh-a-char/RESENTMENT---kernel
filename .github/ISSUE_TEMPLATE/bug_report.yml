name: Bug report
description: Something in the kernel behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **security** issue, please do not open an issue — see
        [SECURITY.md](https://github.com/ni-sh-a-char/RESENTMENT---kernel/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `make version`, or the commit hash.
      placeholder: "RESENTMENT 2.0.0 (kaalachakra) rev da34ffa"
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      multiple: true
      options:
        - x86_64
        - aarch64
        - riscv64
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - QEMU
        - Real hardware
        - Another emulator
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest thing that shows it. A QEMU command line, a SHE script, or
        a patch against `tests/host/` are all ideal.
      render: shell
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Boot log or panic
      description: >
        Paste the serial output. For a panic, include the whole block — the
        causal event list underneath it is often the useful part. Run
        `python tools/addr2sym.py dist/<arch>/resentment.elf <address>` to turn
        an address into a symbol.
      render: text

  - type: textarea
    id: tests
    attributes:
      label: Test results
      description: Output of `make check` and `make qemu-test-all`, if you ran them.
      render: text
