# SPDX-License-Identifier: Apache-2.0
#
# The documentation site is generated from the Markdown in the repository, so
# the docs on the site and the docs in the tree cannot drift apart. There is no
# Jekyll, no theme and no dependency: tools/mksite.py renders the same files a
# reader would otherwise open on GitHub.
name: docs site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "tools/mksite.py"
      - "*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a running one rather than
# racing it, but an in-flight deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: python3 tools/mksite.py

      - name: Check that every internal link resolves
        run: python3 tools/checklinks.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
